# Hardware and disposable-child termination tests are explicit opt-in.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: monitor-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: monitor-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: locked frontend dependencies
        run: npm ci
      - name: frontend types
        run: npm run typecheck
      - name: frontend production-function tests
        run: npm test
      - name: frontend build required by Tauri
        run: npm run build
      - name: rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: strict Rust checks
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: deterministic Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: native release build (no signing or publishing)
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml
  probes:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: existing synthetic privacy/status tests
        run: python -X utf8 scripts/probes/test_probe_privacy.py
      - name: Windows probe aggregation (synthetic, no system API calls)
        run: python -X utf8 scripts/probes/test_windows_readonly.py
